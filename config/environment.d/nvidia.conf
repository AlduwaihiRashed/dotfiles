# Sourced by scripts/start-sway only when an NVIDIA GPU is present, and
# only as a secondary render device -- the GPU driving the connected
# display stays primary in WLR_DRM_DEVICES. Do NOT add GBM_BACKEND or
# __GLX_VENDOR_LIBRARY_NAME here: forcing those session-wide fights with
# whichever GPU is actually doing the compositing/scanout. For PRIME
# render offload of a specific GPU-heavy app instead, run it as:
#   __NVIDIA_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia <cmd>
WLR_NO_HARDWARE_CURSORS=1
