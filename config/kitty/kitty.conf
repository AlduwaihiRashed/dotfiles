font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

# Nord
background #2E3440
foreground #D8DEE9

selection_background #434C5E
selection_foreground #ECEFF4

cursor #D8DEE9
cursor_text_color #2E3440

# Black
color0 #3B4252
color8 #4C566A

# Red
color1 #BF616A
color9 #BF616A

# Green
color2 #A3BE8C
color10 #A3BE8C

# Yellow
color3 #EBCB8B
color11 #EBCB8B

# Blue
color4 #81A1C1
color12 #81A1C1

# Magenta
color5 #B48EAD
color13 #B48EAD

# Cyan
color6 #88C0D0
color14 #8FBCBB

# White
color7 #E5E9F0
color15 #ECEFF4

# Clean appearance
window_padding_width 12

# Sway controls the window border
draw_minimal_borders yes

# No annoying bell
enable_audio_bell no

# Slightly less intrusive cursor
cursor_shape beam

# Tabs
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #2E3440
active_tab_background #88C0D0
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252

confirm_os_window_close 0
